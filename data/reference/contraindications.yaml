# Condition → tags to exclude. Consumed by src/clinical/contraindication.py,
# the HARD safety gate: any food, recipe, or exercise carrying an excluded tag
# is removed before recommendations are ranked. The gate is deterministic and
# runs before (and independent of) any LLM involvement.
#
# Condition keys are matched against (a) conditions derived from risk scoring
# (hypertension, diabetes, anemia) and (b) physician-recorded conditions on the
# patient. Every entry requires a citation.
#
# What a patient does not eat for faith, choice or allergy is a separate list,
# dietary_restrictions.yaml, applied through the same gate.
#
# Exercises: data/lifestyle/raw/exercise_safety_dataset.csv rates every
# exercise safe / modify / avoid for pregnancy, hypertension, diabetes,
# anaemia and knee osteoarthritis, each rating with its reason and the
# guideline behind it (ACOG, NHS, ACSM, ADA, OARSI...). The converter turns
# an "avoid" into the tag avoid_<condition>, which the condition below
# excludes; a "modify" keeps the exercise and the plan shows its note.

conditions:
  hypertension:
    display_en: Hypertension
    display_bn: উচ্চ রক্তচাপ
    exclude_food_tags: [high_sodium]
    exclude_exercise_tags: [avoid_hypertension]
    citation: >
      WHO Guideline: Sodium intake for adults and children (2012) — <2 g/day
      sodium. ACSM Guidelines for Exercise Testing and Prescription, 11th ed. —
      defer high-intensity and heavy isometric exercise in uncontrolled
      hypertension pending physician clearance: the exercise dataset rates
      heavy barbell lifting, pull-ups and explosive loaded lifts "avoid";
      vigorous aerobic work is rated "modify" (controlled blood pressure and
      clearance first) and is never planned automatically.

  diabetes:
    display_en: Diabetes / impaired fasting glucose
    display_bn: ডায়াবেটিস
    exclude_food_tags: [high_sugar]
    exclude_exercise_tags: [avoid_diabetes]
    citation: >
      American Diabetes Association. Standards of Care in Diabetes—2024,
      Facilitating positive health behaviors: minimize intake of added sugars.
      The exercise dataset rates no exercise "avoid" for diabetes; its
      "modify" notes (foot care with neuropathy, no head-down positions or
      heavy straining with unstable retinopathy, ADA; clearance before
      vigorous exercise, ACSM) are shown with the exercise.

  high_cholesterol:
    # recorded by the physician; there is no cholesterol lab band to derive it from
    display_en: High cholesterol
    display_bn: উচ্চ কোলেস্টেরল
    exclude_food_tags: [solid_fat]
    exclude_exercise_tags: []
    citation: >
      Lichtenstein AH et al. 2021 Dietary Guidance to Improve Cardiovascular
      Health: A Scientific Statement From the American Heart Association.
      Circulation 2021;144:e472-e487 — use liquid plant oils rather than
      tropical oils (coconut, palm), animal fats (butter, lard) and partially
      hydrogenated fats. Grundy SM et al. 2018 AHA/ACC Guideline on the
      Management of Blood Cholesterol. Circulation 2019;139:e1082-e1143 —
      reduce saturated fat and prefer nontropical vegetable oils. The food
      table records no saturated or trans fat, so the solid cooking fats are
      excluded by what they are (src/diet/restriction_tags.py): butter, ghee,
      vanaspati, margarine, coconut oil and palm oil, and every dish cooked
      with one. No exercise is excluded: physical activity is part of the
      same guidance.

  anemia:
    display_en: Anemia
    display_bn: রক্তস্বল্পতা
    exclude_food_tags: []
    exclude_exercise_tags: [avoid_anemia]
    citation: >
      Conservative precaution: defer vigorous exercise in moderate/severe
      anemia pending physician clearance (reduced oxygen-carrying capacity;
      ACSM GETP 11th ed., clinical populations). The exercise dataset rates
      the vigorous and strenuous exercises "avoid" ("vigorous so defer until
      treated").

  pregnancy:
    display_en: Pregnancy
    display_bn: গর্ভাবস্থা
    exclude_food_tags: [liver, high_mercury, alcohol]
    exclude_exercise_tags: [avoid_pregnancy, supine_position]
    citation: >
      ACOG Committee Opinion No. 804 (2020): Physical Activity and Exercise
      During Pregnancy and the Postpartum Period — avoid activities with high
      fall/contact risk and prolonged supine positioning. The exercise dataset
      rates jumping, contact, face-down and heavy straining exercises
      "avoid"; the exercises done lying on the back it rates "modify" (keep
      to a few minutes in later pregnancy, NHS; prefer a seated or standing
      version from the 2nd trimester) are excluded throughout pregnancy, as
      before the dataset, so the plan never depends on a recorded trimester.
      Liver: one serving
      exceeds the 3000 ug/day upper level for preformed vitamin A, set on
      teratogenicity (Institute of Medicine 2001, Dietary Reference Intakes
      for Vitamin A; WHO 1998, Safe vitamin A dosage during pregnancy and
      lactation). High-mercury fish: US FDA/EPA, Advice about Eating Fish
      (2021 revision) — choices to avoid when pregnant: shark, swordfish,
      marlin, tilefish, king mackerel, bigeye tuna, orange roughy. Alcohol:
      ACOG Committee Opinion No. 496 (2011) — no safe amount in pregnancy.

  chronic_kidney_disease:
    display_en: Chronic kidney disease
    display_bn: দীর্ঘমেয়াদি কিডনি রোগ
    exclude_food_tags: []
    exclude_exercise_tags: []
    citation: >
      No blanket exclusions: potassium, phosphorus and protein are adjusted to
      the individual's laboratory values and stage (KDOQI Clinical Practice
      Guideline for Nutrition in CKD: 2020 Update. Am J Kidney Dis
      2020;76(3 Suppl 1):S1-S107). Recording the condition stops the planner
      emphasising potassium (src/clinical/rules/deficiency_map.yaml).

  knee_osteoarthritis:
    display_en: Knee osteoarthritis
    display_bn: হাঁটুর অস্টিওআর্থারাইটিস
    exclude_food_tags: []
    exclude_exercise_tags: [avoid_knee_osteoarthritis]
    citation: >
      OARSI guidelines for the non-surgical management of knee, hip, and
      polyarticular osteoarthritis (2019) — prefer low-impact aerobic exercise.
      The exercise dataset rates high-impact work (jumping, running) and deep
      loaded knee bends (lunges, barbell squats, single-leg squats) "avoid".

# Not conditions: who the patient is. src.clinical.contraindication applies
# these from the patient's age and sex, through the same gate.
populations:
  older_adult:
    min_age: 65
    exclude_exercise_tags: [not_for_older_adults]
    citation: >
      WHO guidelines on physical activity and sedentary behaviour (2020) —
      older adults are those aged 65 and over. The exercise dataset rates
      heavy barbell and kettlebell lifts, jumping, single-leg loaded work on
      a step and eyes-closed balance on a cushion unsuitable for them
      (older_adult_suitable = no); "with modification" keeps an exercise and
      the plan points to its easier version.
  male:
    exclude_exercise_tags: [female_only]
    citation: >
      The exercise dataset's sex_suitability: the postnatal abdominal
      exercises are written for women after childbirth (POGP, Fit for the
      Future, 2024).
  female:
    exclude_exercise_tags: [male_only]
    citation: >
      The exercise dataset's sex_suitability: pelvic floor exercises for men
      (POGP, 2021); women have the pelvic floor muscle training row.
