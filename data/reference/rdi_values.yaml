# Recommended daily intakes by demographic group — consumed by
# src/clinical/deficiency.py and src/diet/meal_plan.py.
#
# Values are RDAs (AI where the DRI defines no RDA: fiber, potassium) by
# adult life stage, from the NIH Office of Dietary Supplements DRI tables
# (Institute of Medicine / National Academies): 19–50 y (`*_adult`), 51–70 y
# and over 70. What changes with age: women's iron falls from 18 to 8 mg
# after 50, calcium rises to 1200 mg for women over 50 and men over 70, and
# the fiber AI falls with energy needs. There are no groups for under 19 or
# for lactation: an under-19 patient is scored on the 19–50 values and the
# assessment says so (src/api/services.py). kcal values are approximate
# estimated energy requirements at moderate activity (Dietary Guidelines for
# Americans 2020–2025, Table A2-2) and are refined per patient at runtime
# (Mifflin-St Jeor in src/clinical/bmi.py).
#
# Sodium limit: WHO Guideline: Sodium intake for adults and children (2012):
# <2000 mg/day sodium. The meal planner sets each day's cooking salt so the
# day stays under it (src/diet/meal_plan.py, ration_salt).

groups:
  male_adult:
    kcal: 2500
    protein_g: 56
    fiber_g: 38
    iron_mg: 8
    calcium_mg: 1000
    zinc_mg: 11
    folate_ug: 400
    vit_a_ug: 900
    vit_c_mg: 90
    potassium_mg: 3400

  female_adult:
