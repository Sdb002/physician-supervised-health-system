# Alembic, for the command line: `alembic revision -m "..."`, `alembic upgrade head`.
# The app applies migrations itself at startup (src/db/session.py, init_db), and
# the database is always the one the app is configured for (DATABASE_URL in
# .env), so there is no sqlalchemy.url here.
[alembic]
script_location = src/db/migrations
prepend_sys_path = .
