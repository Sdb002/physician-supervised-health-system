name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    name: Engine and API tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install -e ".[dev]"
      # The trained recommenders are build artifacts (data/models is not in
      # the repository), so the suite runs on the deterministic scorers here.
      - run: pytest

  dashboard:
    name: Dashboard lint, tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # the build type-checks every TypeScript file, the tests included
      - run: npm run build
